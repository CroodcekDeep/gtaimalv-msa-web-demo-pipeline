apiVersion: apps/v1
kind: Deployment
metadata:
  name: gtaimalv-msa-web-demo-pipeline
  labels:
    app: gtaimalv-msa-web-demo-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gtaimalv-msa-web-demo-pipeline
  template:
    metadata:
      labels:
        app: gtaimalv-msa-web-demo-pipeline
    spec:
      containers:
        - name: java-app
          image: image-registry.openshift-image-registry.svc:5000/ginno-taimal-dev/gtaimalv-msa-web-demo-pipeline:latest
          ports:
            - containerPort: 8080
